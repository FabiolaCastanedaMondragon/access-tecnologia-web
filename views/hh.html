<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proceso de Modelado de Datos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: #eef2f7;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .contenedor {
    background: #ffffff;
    max-width: 1400px;
    width: 100%;
    padding: 50px 40px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>

<div class="contenedor">

        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#2563eb"/>
      </linearGradient>
      <linearGradient id="headPurple" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
      <linearGradient id="headGreen" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#059669"/>
      </linearGradient>

      <!-- Fondo de cajas -->
      <linearGradient id="cardBlue" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f8fbff"/>
      </linearGradient>
      <linearGradient id="cardPurple" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#fbfaff"/>
      </linearGradient>
      <linearGradient id="cardGreen" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f7fdfb"/>
      </linearGradient>

      <!-- Rombos -->
      <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#dbeafe"/>
        <stop offset="100%" stop-color="#bfdbfe"/>
      </linearGradient>

      <!-- Sombra suave -->
      <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>

      </marker>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
      </marker>
      <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 5 10 L 10 0 z" fill="#94a3b8"/>
      </marker>

    </text>
    <text x="965" y="610" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">

    <text x="965" y="632" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" font-style="italic">

    </text>

    <line x1="1140" y1="655" x2="1140" y2="690" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowDown)"/>

    <!-- ============ FILA 4 ============ -->
    <g filter="url(#cardShadow)">
      <rect x="60" y="705" width="400" height="105" rx="14" fill="url(#cardBlue)" stroke="#dbeafe" stroke-width="1.5"/>
    </g>
    <circle cx="90" cy="735" r="14" fill="#3b82f6"/>

    <line x1="465" y1="757" x2="495" y2="757" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>

    <g filter="url(#cardShadow)">
      <rect x="500" y="705" width="400" height="105" rx="14" fill="url(#cardPurple)" stroke="#e9d5ff" stroke-width="1.5"/>

    <text x="965" y="770" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">
